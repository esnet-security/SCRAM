---
name: Run Scripts Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write

jobs:
  scripts:
    name: Run Scripts Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Scripts Tests
        run: make test-scripts

      - name: Upload Coverage to Coveralls
        if: ${{ !env.ACT }}
        uses: coverallsapp/github-action@v2
        with:
          file: ./scripts/coverage.xml
          base-path: scripts/src
          fail-on-error: false
          parallel: true
          flag-name: scripts
          # Shared across all test workflows so Coveralls merges them into one build which is closed by the coveralls-finish workflow.
          build-number: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Display Scripts Coverage Metrics
        if: ${{ !env.ACT }}
        uses: 5monkeys/cobertura-action@v14
        with:
          report_name: "Scripts Coverage"
          path: ./scripts/coverage.xml
          minimum_coverage: "50"

  coveralls-finish:
    name: Close Coveralls Build
    needs: scripts
    if: ${{ always() }}
    uses: ./.github/workflows/coveralls-finish.yml
